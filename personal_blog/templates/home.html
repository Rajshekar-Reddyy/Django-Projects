{% extends 'base.html' %}
{% block content %}
 <h1>My Personal Blog</h1>
    <hr>
    {% for post in posts %}
   <a href="{% url 'post_detail' post.id %}">{{post.title}}</a>
   <p>{{post.content}}</p>
    <h2>By {{post.author}}</h2>
    <p>{{post.created_at}}</p>
    <hr>
    {% endfor %}

{% endblock %}
